<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>گزارش</title>
  <style>
    :root{
      color-scheme: light;
      --bg:#f6f8fc;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --border:#dbe3f0;
      --ok:#0f8a4a;
      --err:#c2410c;
      --btn:#2563eb;
      --btnText:#ffffff;
      --shadow:0 10px 30px rgba(15,23,42,.08);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:20px;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    }
    .box{
      width:min(520px,100%);
      background:var(--card);
      border:1px solid var(--border);
      border-radius:16px;
      padding:20px;
      box-shadow:var(--shadow);
    }
    #msg{
      font-size:15px;
      line-height:1.9;
      color:var(--muted);
      word-break:break-word;
    }
    #msg.ok{color:var(--ok)}
    #msg.err{color:var(--err)}
    .actions{margin-top:16px}
    button{
      border:0;
      background:var(--btn);
      color:var(--btnText);
      border-radius:12px;
      padding:11px 16px;
      font:600 14px system-ui;
      cursor:pointer;
    }
    button:active{transform:translateY(1px)}
    .hide{display:none}
  </style>
</head>
<body>
  <div class="box">
    <div id="msg">در حال بررسی لینک...</div>
    <div class="actions">
      <button id="openBtn" class="hide" type="button">باز کردن دستی</button>
    </div>
  </div>

  <script>
    (() => {
      const API = "https://api.github.com/repos/WendigosCyber/WendigosCyber.github.io/issues?state=open&per_page=100";
      const msg = document.getElementById("msg");
      const btn = document.getElementById("openBtn");

      const text = v => String(v || "").trim();
      const lower = v => text(v).toLowerCase();
      const enc = v => encodeURIComponent(text(v));
      const pick = v => Array.isArray(v) ? v[Math.floor(Math.random() * v.length)] : v;

      const list = v => {
        if (Array.isArray(v)) return v.map(text).filter(Boolean);
        if (typeof v === "string" && text(v)) return [text(v)];
        return [];
      };

      const setMsg = (value, type = "") => {
        msg.className = type;
        msg.textContent = value;
      };

      const params = new URLSearchParams(location.search);
      const key =
        text(params.get("issue")) ||
        text(params.get("report")) ||
        text(params.get("r")) ||
        "";

      if (!location.search || location.search === "?" || !key) {
        setMsg("خطا: لینک معتبر نیست یا اطلاعاتی برای جستجو وجود ندارد.", "err");
        return;
      }

      fetch(API, { headers: { Accept: "application/vnd.github+json" } })
        .then(r => {
          if (!r.ok) throw new Error("GitHub unavailable");
          return r.json();
        })
        .then(issues => {
          const issue = issues.find(x => !x.pull_request && lower(x.title) === lower(key));
          if (!issue) throw new Error("Issue not found");

          const raw = text(issue.body);
          const match = raw.match(/```(?:json)?\s*([\s\S]*?)```/i);
          const jsonText = text(match ? match[1] : raw);

          let data;
          try {
            data = JSON.parse(jsonText);
          } catch {
            throw new Error("Invalid JSON");
          }

          const targets = list(data.GmailTargets);
          const heads = list(data.GmailHeadr);
          const bodies = list(data.GmailBody);

          if (!targets.length || !heads.length || !bodies.length) {
            throw new Error("Missing email fields");
          }

          const mailto =
            "mailto:" + targets.join(",") +
            "?subject=" + enc(pick(heads)) +
            "&body=" + enc(pick(bodies));

          btn.classList.remove("hide");
          btn.onclick = () => location.href = mailto;

          setMsg("گزارش پیدا شد؛ در حال انتقال به ایمیل...", "ok");
          setTimeout(() => {
            location.href = mailto;
          }, 250);
        })
        .catch(() => {
          setMsg("خطا: گزارش پیدا نشد یا اطلاعات گیت‌هاب در دسترس نبود.", "err");
        });
    })();
  </script>
</body>
</html>
