<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wendigos_Cyber - داشبورد اطلاعاتی</title>
    <style>
        :root {
            --bg: #080808;
            --bg2: #0c0c0c;
            --bg3: #111111;
            --bg4: #161616;
            --red: #ff1a1a;
            --red2: #cc0000;
            --red3: #990000;
            --red4: #660000;
            --red5: #330000;
            --red6: #1a0000;
            --text: #e0e0e0;
            --text2: #b0b0b0;
            --text3: #707070;
            --glow: #ff3333;
            --shadow: rgba(255, 0, 0, 0.1);
            --font: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.7;
            font-size: 14px;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(255,0,0,0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255,0,0,0.03) 0%, transparent 50%);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg2); }
        ::-webkit-scrollbar-thumb { background: var(--red4); }
        ::-webkit-scrollbar-thumb:hover { background: var(--red3); }
        ::selection { background: var(--red3); color: #fff; }

        .container { max-width: 1400px; margin: 0 auto; padding: 20px 16px; min-height: 100vh; display: flex; flex-direction: column; }

        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 24px; background: var(--bg2);
            margin-bottom: 20px; position: relative; overflow: hidden; flex-wrap: wrap; gap: 12px;
            animation: slideDown 0.5s ease;
            border-left: 2px solid var(--red);
        }
        .header::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--red), var(--red2), var(--red), transparent);
            animation: scan 3s ease-in-out infinite;
        }
        @keyframes scan { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        .logo-area { display: flex; align-items: center; gap: 14px; }
        .logo-svg { width: 48px; height: 48px; flex-shrink: 0; animation: rotatePulse 4s ease-in-out infinite; }
        @keyframes rotatePulse { 0%,100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.05); opacity: 1; } }
        .logo-text h1 { font-size: 1.4rem; font-weight: 700; color: var(--red); letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 20px var(--shadow), 0 0 40px var(--shadow); }
        .logo-text span { font-size: 0.7rem; color: var(--text3); letter-spacing: 4px; text-transform: uppercase; }

        .header-status { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
        .status-dot { display: flex; align-items: center; gap: 6px; font-size: 0.7rem; color: var(--text2); }
        .status-dot .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; box-shadow: 0 0 10px var(--red); } 50% { opacity: 0.4; box-shadow: 0 0 2px var(--red); } }
        .status-dot .dot.offline { background: var(--text3); animation: none; box-shadow: none; }

        .search-wrapper { position: relative; margin-bottom: 16px; }
        .search-input {
            width: 100%; padding: 14px 20px; padding-left: 50px;
            background: var(--bg2); color: var(--text); font-family: var(--font);
            font-size: 0.9rem; outline: none; transition: all 0.3s; letter-spacing: 0.5px;
            border: none; border-bottom: 2px solid var(--red4);
        }
        .search-input::placeholder { color: var(--text3); letter-spacing: 1px; }
        .search-input:focus { background: var(--bg3); box-shadow: 0 0 20px rgba(255,0,0,0.15); border-bottom-color: var(--red); }
        .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; pointer-events: none; opacity: 0.5; }
        .search-hint { font-size: 0.6rem; color: var(--text3); margin-top: 4px; padding: 0 4px; letter-spacing: 0.5px; }

        .stats-bar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .stat-chip { padding: 6px 14px; background: var(--bg2); font-size: 0.65rem; color: var(--text2); letter-spacing: 0.5px; transition: all 0.3s; border-left: 2px solid var(--red4); }
        .stat-chip:hover { background: var(--bg3); transform: translateY(-2px); }
        .stat-chip .num { color: var(--red); font-weight: 700; font-size: 0.8rem; }

        .sections-grid { display: flex; flex-direction: column; gap: 12px; flex: 1; }
        .section-card { background: var(--bg2); overflow: hidden; transition: all 0.3s cubic-bezier(0.4,0,0.2,1); border-bottom: 1px solid var(--red4); }
        .section-card:hover { background: var(--bg3); box-shadow: 0 0 20px rgba(255,0,0,0.05); }
        .section-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; cursor: pointer; user-select: none; transition: all 0.2s; }
        .section-header:hover { background: var(--bg4); }
        .section-title { flex: 1; font-size: 0.85rem; font-weight: 600; letter-spacing: 1px; color: var(--text); }
        .section-count { font-size: 0.65rem; color: var(--red); background: var(--red5); padding: 4px 10px; margin-left: 12px; font-weight: 700; }
        .chevron { width: 16px; height: 16px; transition: transform 0.3s ease; flex-shrink: 0; }
        .section-card.open .chevron { transform: rotate(180deg); }
        .section-body { display: none; padding: 0 20px 20px; border-top: 1px solid rgba(255,0,0,0.1); padding-top: 16px; }
        .section-card.open .section-body { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

        .item-list { display: flex; flex-direction: column; gap: 8px; }
        .item-card { background: var(--bg3); padding: 12px 16px; transition: all 0.2s; position: relative; border-right: 2px solid var(--red4); }
        .item-card:hover { background: var(--bg4); border-right-color: var(--red); }
        .item-card.has-coords { cursor: pointer; }
        .item-card.has-coords:hover { box-shadow: 0 0 16px rgba(255,0,0,0.08); transform: translateX(-4px); }
        .item-name { font-size: 0.8rem; font-weight: 600; color: var(--red); letter-spacing: 0.5px; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .map-indicator { font-size: 0.55rem; color: var(--text3); background: var(--bg4); padding: 2px 8px; letter-spacing: 0.5px; cursor: pointer; transition: all 0.2s; }
        .map-indicator:hover { color: var(--red); background: var(--red5); }
        .item-description { font-size: 0.72rem; color: var(--text2); letter-spacing: 0.3px; }
        .item-details { font-size: 0.68rem; color: var(--text3); margin-top: 6px; letter-spacing: 0.2px; border-right: 2px solid var(--red4); padding-right: 10px; }

        .map-modal { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; padding: 20px; }
        .map-modal.active { display: flex; }
        .map-modal-content { background: var(--bg2); width: 100%; max-width: 900px; height: 80vh; display: flex; flex-direction: column; overflow: hidden; position: relative; border: 1px solid var(--red4); }
        .map-modal-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--bg3); border-bottom: 1px solid rgba(255,0,0,0.15); }
        .map-modal-header .title { font-size: 0.75rem; color: var(--text); letter-spacing: 1px; }
        .close-btn { width: 28px; height: 28px; cursor: pointer; background: var(--red5); display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .close-btn:hover { background: var(--red3); }
        .close-btn svg { width: 14px; height: 14px; }
        .map-iframe { flex: 1; width: 100%; border: none; }
        .map-footer { padding: 8px 16px; background: var(--bg3); border-top: 1px solid rgba(255,0,0,0.15); font-size: 0.65rem; color: var(--text3); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .map-footer a { color: var(--red); text-decoration: none; font-size: 0.65rem; letter-spacing: 0.5px; }
        .map-footer a:hover { text-decoration: underline; }
        .copy-btn { cursor: pointer; color: var(--red); font-size: 0.65rem; background: none; border: none; font-family: var(--font); letter-spacing: 0.5px; }

        .footer { margin-top: 20px; padding: 16px 20px; background: var(--bg2); text-align: center; font-size: 0.65rem; color: var(--text3); letter-spacing: 1px; position: relative; overflow: hidden; border-top: 2px solid var(--red4); }
        .footer::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--red4), transparent); }

        @media (max-width: 768px) {
            .container { padding: 10px 8px; }
            .header { padding: 12px 16px; flex-direction: column; align-items: flex-start; }
            .logo-text h1 { font-size: 1.1rem; }
            .section-header { padding: 12px 14px; }
            .section-body { padding: 0 12px 14px; padding-top: 12px; }
            .item-card { padding: 10px 12px; }
            .map-modal-content { height: 90vh; }
        }
        @media (max-width: 480px) {
            .logo-text h1 { font-size: 0.9rem; letter-spacing: 1px; }
            .logo-text span { font-size: 0.55rem; letter-spacing: 2px; }
            .section-header .section-title { font-size: 0.72rem; }
            .item-name { font-size: 0.7rem; flex-wrap: wrap; }
            .item-description { font-size: 0.62rem; }
            .item-details { font-size: 0.58rem; }
        }
    </style>
</head>

        // ============ NLP-LIKE SEARCH ============
        function tokenizeQuery(q) {
            const normalized = q.toLowerCase().replace(/[،,]/g, ' ').replace(/\s+/g, ' ').trim();
            const tokens = normalized.split(' ');
            const result = { and: [], or: [], not: [] };
            let current = 'and';
            tokens.forEach(t => {
                if (t === 'and') current = 'and';
                else if (t === 'or') current = 'or';
                else if (t === 'not' || t === '!') current = 'not';
                else result[current].push(t);
            });
            return result;
        }

        function matchNLP(item, queryTokens) {
            const haystack = (item.name + ' ' + item.desc + ' ' + item.details).toLowerCase();
            const and = queryTokens.and.length === 0 || queryTokens.and.every(t => haystack.includes(t));
            const or = queryTokens.or.length === 0 || queryTokens.or.some(t => haystack.includes(t));
            const not = queryTokens.not.length === 0 || !queryTokens.not.some(t => haystack.includes(t));
            return and && or && not;
        }

        // ============ RENDER ============
        const sectionsContainer = document.getElementById('sectionsContainer');
        const statsBar = document.getElementById('statsBar');
        const searchInput = document.getElementById('searchInput');
        const mapModal = document.getElementById('mapModal');
        const mapIframe = document.getElementById('mapIframe');
        const mapModalTitle = document.getElementById('mapModalTitle');
        const mapCoordsText = document.getElementById('mapCoordsText');
        const mapExternalLink = document.getElementById('mapExternalLink');
        const copyCoordsBtn = document.getElementById('copyCoordsBtn');
        const mapModalClose = document.getElementById('mapModalClose');

        let totalItems = 0;
        let coordsItems = 0;

        function renderStats() {
            DATA.sections.forEach(s => totalItems += s.items.length);
            DATA.sections.forEach(s => s.items.forEach(i => { if (i.coords) coordsItems++; }));
            statsBar.innerHTML = `
                <div class="stat-chip">SECTIONS: <span class="num">${DATA.sections.length}</span></div>
                <div class="stat-chip">TOTAL TARGETS: <span class="num">${totalItems}</span></div>
                <div class="stat-chip">GPS TRACKED: <span class="num">${coordsItems}</span></div>
                <div class="stat-chip">DATA: <span class="num">2026</span></div>
                <div class="stat-chip">STATUS: <span class="num" style="color:#ff1a1a">ACTIVE</span></div>
            `;
        }

        function renderSections(queryTokens = null) {
            sectionsContainer.innerHTML = '';
            let visibleCount = 0;

            DATA.sections.forEach(section => {
                const filteredItems = section.items.filter(item => {
                    if (!queryTokens) return true;
                    return matchNLP(item, queryTokens);
                });

                if (queryTokens && filteredItems.length === 0) return;
                visibleCount += filteredItems.length;

                const card = document.createElement('div');
                card.className = 'section-card' + (queryTokens ? ' open' : '');

                const itemsHtml = filteredItems.map(item => {
                    const hasCoords = item.coords ? 'has-coords' : '';
                    const mapBtn = item.coords ? `<span class="map-indicator" data-coords="${item.coords}" data-name="${item.name}">GPS</span>` : '';
                    return `
                        <div class="item-card ${hasCoords}" data-coords="${item.coords || ''}" data-name="${item.name}">
                            <div class="item-name">${item.name} ${mapBtn}</div>
                            <div class="item-description">${item.desc || ''}</div>
                            ${item.details ? `<div class="item-details">${item.details}</div>` : ''}
                        </div>
                    `;
                }).join('');

                card.innerHTML = `
                    <div class="section-header">
                        <div class="section-title">${section.title}</div>
                        <div class="section-count">${filteredItems.length} ITEMS</div>
                        <svg class="chevron" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M4 6l4 4 4-4" stroke="#ff1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="section-body">
                        <div class="item-list">${itemsHtml}</div>
                    </div>
                `;

                card.querySelector('.section-header').addEventListener('click', () => {
                    card.classList.toggle('open');
                });

                sectionsContainer.appendChild(card);

                card.querySelectorAll('.map-indicator').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        openMap(btn.dataset.coords, btn.dataset.name);
                    });
                });

                card.querySelectorAll('.item-card.has-coords').forEach(item => {
                    item.addEventListener('click', () => {
                        if (item.dataset.coords) openMap(item.dataset.coords, item.dataset.name);
                    });
                });
            });

            if (sectionsContainer.innerHTML === '') {
                sectionsContainer.innerHTML = `
                    <div style="text-align:center;padding:40px;color:var(--text3);font-size:0.8rem;letter-spacing:1px;">
                        NO TARGETS FOUND
                    </div>
                `;
            }

            statsBar.querySelector('.stat-chip:last-child .num').textContent = visibleCount;
        }

        function openMap(coords, name) {
            const [lat, lng] = coords.split(',');
            const embedUrl = `https://www.google.com/maps?q=${lat},${lng}&z=16&t=k&output=embed`;
            const externalUrl = `https://www.google.com/maps?q=${lat},${lng}&z=16&t=k`;
            mapIframe.src = embedUrl;
            mapModalTitle.textContent = name || 'LOCATION';
            mapCoordsText.textContent = `COORDINATES: ${coords}`;
            mapExternalLink.href = externalUrl;
            mapModal.classList.add('active');
        }

        function closeMap() {
            mapModal.classList.remove('active');
            mapIframe.src = '';
        }

        copyCoordsBtn.addEventListener('click', () => {
            const text = mapCoordsText.textContent.replace('COORDINATES: ', '');
            navigator.clipboard.writeText(text).then(() => {
                copyCoordsBtn.textContent = 'COPIED!';
                setTimeout(() => copyCoordsBtn.textContent = 'COPY', 1000);
            });
        });

        mapModalClose.addEventListener('click', closeMap);
        mapModal.addEventListener('click', (e) => { if (e.target === mapModal) closeMap(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMap(); });

        searchInput.addEventListener('input', (e) => {
            const q = e.target.value.trim();
            if (q === '') {
                renderSections();
            } else {
                const tokens = tokenizeQuery(q);
                renderSections(tokens);
            }
        });

        renderStats();
        renderSections();
    </script>
