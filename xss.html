<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جستجوی آسیب‌پذیر XSS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    h1 {
      color: #1e3c72;
      margin-bottom: 10px;
      font-size: 2.5rem;
      letter-spacing: 1px;
    }

    .subtitle {
      color: #555;
      margin-bottom: 30px;
      font-size: 1rem;
    }

    .search-form {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    .search-input {
      flex: 1;
      padding: 12px 20px;
      border: 2px solid #ccc;
      border-radius: 30px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }

    .search-input:focus {
      border-color: #1e3c72;
    }

    .search-btn {
      padding: 12px 25px;
      background: #1e3c72;
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }

    .search-btn:hover {
      background: #2a5298;
      transform: scale(1.05);
    }

    .result-box {
      background: #f9f9f9;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
      text-align: left;
      border-left: 5px solid #1e3c72;
      word-break: break-word;
    }

    .result-title {
      font-weight: bold;
      color: #1e3c72;
      margin-bottom: 10px;
    }

    .result-content {
      color: #333;
      font-size: 1.1rem;
    }

    .highlight {
      background: yellow;
      padding: 2px 4px;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>جستجوگر</h1>
    <p class="subtitle">جستجوی امن؟ نه! این صفحه عمداً آسیب‌پذیر است.</p>

    <form class="search-form" id="searchForm" action="" method="GET">
      <input type="text" name="q" class="search-input" placeholder="عبارت جستجو..." id="searchInput">
      <button type="submit" class="search-btn">جستجو</button>
    </form>

    <div class="result-box" id="resultBox" style="display: none;">
      <div class="result-title">نتیجه جستجو برای:</div>
      <div class="result-content" id="resultContent"></div>
    </div>
  </div>

  <script>
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }
    function displayResult() {
      const query = getQueryParam('q');
      const resultBox = document.getElementById('resultBox');
      const resultContent = document.getElementById('resultContent');
      if (query) {
        resultContent.innerHTML = 'شما جستجو کردید: <span class="highlight">' + query + '</span>';
        resultBox.style.display = 'block';
      } else {
        resultBox.style.display = 'none';
      }
    } window.addEventListener('DOMContentLoaded', displayResult); document.getElementById('searchForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const input = document.getElementById('searchInput').value;
      const newUrl = window.location.pathname + '?q=' + encodeURIComponent(input);
      window.history.pushState({}, '', newUrl);
      displayResult();
    }); window.addEventListener('popstate', displayResult);
  </script>
</body>
  </html>
